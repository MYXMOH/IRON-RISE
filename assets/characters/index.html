<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>IRON RISE — The Long Grind</title><link rel="stylesheet" href="style.css"></head><body>
<div class="app">
<header><div class="brand"><b>IRON <span>RISE</span></b><small>THE LONG GRIND</small></div><div class="resources"><div>⚡ <strong id="energy">100</strong></div><div>☠ <strong id="power">0</strong></div><div>🪙 <strong id="coins">0</strong></div><div>💎 <strong id="gems">100</strong></div></div><div class="headBtns"><button id="rewardBtn">🎁</button><button id="settingsBtn">⚙</button></div></header>
<section class="path" id="path"></section>
<main><aside class="panel stats"><h2>STATS</h2><div class="stat"><span>☠ POWER</span><b id="power2">0</b></div><div class="stat"><span>⚡ ENERGY</span><b id="energy2">100 / 100</b></div><div class="stat"><span>💪 PER TAP</span><b id="tapPower">1</b></div><div class="stat"><span>🟣 COMBO</span><b id="combo">x0</b></div><div class="stat"><span>🔥 CRITICAL</span><b id="crit">5%</b></div><div class="stageBox"><small>STAGE <span id="stageNum">1</span> / 10</small><h3 id="stageName">ROOKIE</h3><div class="bar"><i id="stageBar"></i></div><p id="stageReq">0 / 100 POWER</p></div><div class="miniGrid"><button id="upgradeBtn">⬆<br>UPGRADE</button><button id="trainingBtn">🏋<br>TRAINING</button><button id="shopBtn">🛒<br>SHOP</button><button id="resetBtn">↻<br>RESET</button></div></aside>
<section class="hero panel"><div class="heroTop"><div><small>STAGE <span id="heroStage">1</span></small><h1 id="heroName">ROOKIE</h1></div><button id="dailyBtn">🎁<small>DAILY REWARD</small></button></div><div class="characterWrap"><img id="character" src="assets/characters/stage-01.png" alt="Iron Rise character"><div class="powerFloat" id="float"></div></div><button class="train" id="trainBtn">TRAIN <small>+<span id="trainAmount">1</span> POWER</small></button><div class="auto"><label>AUTO TRAIN</label><button id="autoBtn" class="toggle off"><i></i></button></div></section>
<aside class="panel missions"><h2>MISSIONS</h2><div id="missions"></div><h2>ACHIEVEMENTS</h2><div id="achievements" class="ach"></div></aside></main>
<footer><span>IRON RISE v1.0</span><span>Stages 11–20 <b>COMING SOON</b></span><span>Autosave: ON</span></footer>
</div><script src="game.js"></script></body></html>
